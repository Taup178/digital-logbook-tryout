<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">Digital Logbook domain model diagram</title><desc id="desc">User owns projects, entries, fields, and activity log records; projects group entries.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#58443d"/></marker><style>text{font-family:Arial,sans-serif;fill:#332824}.heading{font-size:25px;font-weight:700}.label{font-size:17px;font-weight:700}.field{font-family:monospace;font-size:14px}.class{fill:#fff;stroke:#8d6e63;stroke-width:2}.header{fill:#f5e7ef;stroke:#8d6e63;stroke-width:2}.edge{stroke:#58443d;stroke-width:2;fill:none;marker-end:url(#arrow)}.cardinality{font-size:15px;font-weight:700}</style></defs>
<rect width="1200" height="850" fill="#fffaf7"/><text x="600" y="42" text-anchor="middle" class="heading">Digital Logbook Domain Model</text>
<g><rect x="60" y="140" width="210" height="175" class="class"/><rect x="60" y="140" width="210" height="42" class="header"/><text x="165" y="167" text-anchor="middle" class="label">User</text><text x="78" y="210" class="field">+ email: varchar PK</text><text x="78" y="235" class="field">+ username: varchar</text><text x="78" y="260" class="field">+ name: varchar</text><text x="78" y="285" class="field">+ deleted: boolean</text>
<rect x="430" y="100" width="260" height="200" class="class"/><rect x="430" y="100" width="260" height="42" class="header"/><text x="560" y="127" text-anchor="middle" class="label">Project</text><text x="448" y="170" class="field">+ id: bigint PK</text><text x="448" y="195" class="field">+ user_email: varchar</text><text x="448" y="220" class="field">+ project_name: varchar</text><text x="448" y="245" class="field">+ description: text</text><text x="448" y="270" class="field">+ archived: boolean</text>
<rect x="880" y="100" width="260" height="220" class="class"/><rect x="880" y="100" width="260" height="42" class="header"/><text x="1010" y="127" text-anchor="middle" class="label">Entry</text><text x="898" y="170" class="field">+ id: uuid PK</text><text x="898" y="195" class="field">+ user_email: varchar</text><text x="898" y="220" class="field">+ project_name: varchar</text><text x="898" y="245" class="field">+ entries: jsonb</text><text x="898" y="270" class="field">+ due_date: timestamptz</text><text x="898" y="295" class="field">+ priority: priority_level</text>
<rect x="430" y="540" width="260" height="190" class="class"/><rect x="430" y="540" width="260" height="42" class="header"/><text x="560" y="567" text-anchor="middle" class="label">Field</text><text x="448" y="610" class="field">+ id: uuid PK</text><text x="448" y="635" class="field">+ user_email: varchar</text><text x="448" y="660" class="field">+ table_name: varchar</text><text x="448" y="685" class="field">+ field_name: varchar</text><text x="448" y="710" class="field">+ data_type: varchar</text>
<rect x="880" y="530" width="260" height="200" class="class"/><rect x="880" y="530" width="260" height="42" class="header"/><text x="1010" y="557" text-anchor="middle" class="label">ActivityLog</text><text x="898" y="600" class="field">+ id: uuid PK</text><text x="898" y="625" class="field">+ user_email: varchar</text><text x="898" y="650" class="field">+ action: varchar</text><text x="898" y="675" class="field">+ entity_type: varchar</text><text x="898" y="700" class="field">+ details: jsonb</text></g>
<path d="M270 190H420" class="edge"/><text x="284" y="178" class="cardinality">1</text><text x="390" y="178" class="cardinality">0..*</text><text x="335" y="215" text-anchor="middle" class="field">owns</text><path d="M690 190H870" class="edge"/><text x="704" y="178" class="cardinality">1</text><text x="840" y="178" class="cardinality">0..*</text><text x="780" y="215" text-anchor="middle" class="field">groups</text>
<path d="M165 315V470H560V530" class="edge"/><text x="177" y="340" class="cardinality">1</text><text x="540" y="515" class="cardinality">0..*</text><text x="410" y="458" text-anchor="middle" class="field">defines</text><path d="M165 315V450H1010V520" class="edge"/><text x="177" y="340" class="cardinality">1</text><text x="990" y="505" class="cardinality">0..*</text><text x="620" y="438" text-anchor="middle" class="field">records</text><path d="M270 270H870" class="edge"/><text x="284" y="290" class="cardinality">1</text><text x="840" y="290" class="cardinality">0..*</text><text x="570" y="260" text-anchor="middle" class="field">scopes</text>
</svg>