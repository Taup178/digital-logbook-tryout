<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1000" viewBox="0 0 1450 1000" role="img" aria-labelledby="title desc">
<title id="title">Sign-in and initial data synchronization sequence diagram</title><desc id="desc">A user signs in with Supabase, then the frontend loads projects, entries, and profile data into IndexedDB.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#58443d"/></marker><style>text{font-family:Arial,sans-serif;fill:#332824}.heading{font-size:25px;font-weight:700}.label{font-size:15px;font-weight:700}.detail{font-size:13px}.participant{fill:#f5e7ef;stroke:#a66a88;stroke-width:2;rx:8}.life{stroke:#9b8b84;stroke-width:1.5;stroke-dasharray:6 5}.msg{stroke:#58443d;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.reply{stroke:#58443d;stroke-width:1.8;fill:none;stroke-dasharray:6 4;marker-end:url(#arrow)}.group{fill:#fdf6f2;stroke:#c5a28e;stroke-width:1.5;stroke-dasharray:6 4}</style></defs>
<rect width="1450" height="1000" fill="#fffaf7"/><text x="725" y="38" text-anchor="middle" class="heading">Sign-in and Initial Data Synchronization</text>
<g text-anchor="middle"><rect x="50" y="70" width="130" height="48" class="participant"/><text x="115" y="100" class="label">User</text><rect x="250" y="70" width="130" height="48" class="participant"/><text x="315" y="100" class="label">React frontend</text><rect x="450" y="70" width="130" height="48" class="participant"/><text x="515" y="100" class="label">Supabase Auth</text><rect x="650" y="70" width="130" height="48" class="participant"/><text x="715" y="100" class="label">project-service</text><rect x="850" y="70" width="130" height="48" class="participant"/><text x="915" y="100" class="label">profile-service</text><rect x="1050" y="70" width="130" height="48" class="participant"/><text x="1115" y="100" class="label">PostgreSQL</text><rect x="1250" y="70" width="130" height="48" class="participant"/><text x="1315" y="100" class="label">IndexedDB</text></g>
<g class="life"><path d="M115 118V950"/><path d="M315 118V950"/><path d="M515 118V950"/><path d="M715 118V950"/><path d="M915 118V950"/><path d="M1115 118V950"/><path d="M1315 118V950"/></g>
<path d="M115 165H305" class="msg"/><text x="210" y="154" text-anchor="middle" class="detail">Submit email and password</text><path d="M315 215H505" class="msg"/><text x="410" y="204" text-anchor="middle" class="detail">signInWithPassword()</text><path d="M515 265H325" class="reply"/><text x="420" y="254" text-anchor="middle" class="detail">Session with JWT</text><path d="M315 315H370V335H315" class="msg"/><text x="390" y="326" class="detail">Start syncAllData(email)</text>
<rect x="215" y="365" width="1140" height="465" class="group"/><text x="235" y="392" class="label">Parallel initial data load</text>
<text x="235" y="425" class="label">Projects</text><path d="M315 455H705" class="msg"/><text x="510" y="444" text-anchor="middle" class="detail">POST /service/project + JWT</text><path d="M715 495H1105" class="msg"/><text x="910" y="484" text-anchor="middle" class="detail">Query projects</text><path d="M1115 535H725" class="reply"/><text x="920" y="524" text-anchor="middle" class="detail">Projects</text><path d="M715 575H325" class="reply"/><text x="520" y="564" text-anchor="middle" class="detail">Project response</text><path d="M315 615H1305" class="msg"/><text x="810" y="604" text-anchor="middle" class="detail">Store projects</text>
<text x="235" y="665" class="label">Entries</text><path d="M315 695H705" class="msg"/><text x="510" y="684" text-anchor="middle" class="detail">POST /service/entry (getAll) + JWT</text><path d="M715 735H1105" class="msg"/><text x="910" y="724" text-anchor="middle" class="detail">Query entries</text><path d="M1115 775H725" class="reply"/><text x="920" y="764" text-anchor="middle" class="detail">Entries</text><path d="M715 815H325" class="reply"/><text x="520" y="804" text-anchor="middle" class="detail">Entry response; store entries</text>
<path d="M315 865H905" class="msg"/><text x="610" y="854" text-anchor="middle" class="detail">POST /service/profile (getProfile) + JWT</text><path d="M915 895H1105" class="msg"/><text x="1010" y="884" text-anchor="middle" class="detail">Query profile</text><path d="M1115 925H925" class="reply"/><path d="M915 950H325" class="reply"/><text x="620" y="939" text-anchor="middle" class="detail">Profile response; store profile</text><path d="M315 980H105" class="reply"/><text x="210" y="969" text-anchor="middle" class="detail">Render dashboard from cache</text>
</svg>