name: digital-logbook

x-backend: &backend
  restart: unless-stopped
  init: true

services:
  auth-service:
    <<: *backend
    build: ./services/auth-service
    env_file: ./services/auth-service/.env
    environment:
      PORT: 5001

  dashboard-service:
    <<: *backend
    build: ./services/dashboard-service
    env_file: ./services/dashboard-service/.env
    environment:
      PORT: 5002

  project-service:
    <<: *backend
    build: ./services/project-service
    env_file: ./services/project-service/.env
    environment:
      PORT: 5003

  profile-service:
    <<: *backend
    build: ./services/profile-service
    env_file: ./services/profile-service/.env
    environment:
      PORT: 5004

  api-gateway:
    <<: *backend
    build: ./api-gateway
    environment:
      PORT: 4000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      AUTH_SERVICE_URL: http://auth-service:5001
      DASHBOARD_SERVICE_URL: http://dashboard-service:5002
      PROJECT_SERVICE_URL: http://project-service:5003
      PROFILE_SERVICE_URL: http://profile-service:5004
    depends_on:
      auth-service:
        condition: service_healthy
      dashboard-service:
        condition: service_healthy
      project-service:
        condition: service_healthy
      profile-service:
        condition: service_healthy

  frontend:
    <<: *backend
    build:
      context: ./frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL in the root .env}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?Set VITE_SUPABASE_ANON_KEY in the root .env}
        VITE_API_GATEWAY_URL: ''
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      api-gateway:
        condition: service_healthy
